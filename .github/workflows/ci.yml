name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI: faster links and a smaller cache. Coverage uses
  # instrumentation, not debug info.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# Pull requests run only the areas they change; pushes to main and manual
# runs run every gate. A job skipped by `if` reports success, so selected jobs
# can be skipped without blocking a pull request. The `ci` job is the single
# gate to require in branch protection: it also fails when the selector itself
# or a selected job fails. The selector fails closed (scripts/changed-areas.sh).
jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      web: ${{ steps.classify.outputs.web }}
      proto: ${{ steps.classify.outputs.proto }}
      deps: ${{ steps.classify.outputs.deps }}
      observability: ${{ steps.classify.outputs.observability }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The selector diffs the merge base, so it needs the base history.
          fetch-depth: 0
      - name: Test the changed-area selector
        run: scripts/changed-areas.test.sh
      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            scripts/changed-areas.sh --base "$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            scripts/changed-areas.sh --all >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - run: make fmt-check

  proto:
    name: Protobuf lint and breaking changes
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make proto-lint
      - run: make proto-breaking PROTO_BASE=origin/${{ github.base_ref || 'main' }}

  lint:
    name: Check, clippy, docs
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # clippy --all-targets type-checks everything `make check` would.
      - run: make clippy
      - run: make doc

  test:
    name: Tests and coverage
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          # Keep in step with `nextest-version` in .config/nextest.toml.
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1
      # Build workspace tests and the real worker with one coverage environment.
      - name: Tests, coverage, and process recovery acceptance
        run: |
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit="bergsmith-acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=Delegate=yes --uid="$(id -u)" --gid="$(id -g)" \
            --working-directory="$PWD" --setenv="PATH=$PATH" --setenv="HOME=$HOME" \
            --setenv=CARGO_PROFILE_DEV_DEBUG=0 --setenv=CARGO_PROFILE_TEST_DEBUG=0 \
            --setenv="RUSTFLAGS=$RUSTFLAGS" --setenv="CARGO_INCREMENTAL=$CARGO_INCREMENTAL" \
            --setenv="RUST_BACKTRACE=$RUST_BACKTRACE" --setenv="CARGO_TERM_COLOR=$CARGO_TERM_COLOR" \
            /bin/bash deploy/docker/distributed-scope.sh coverage-distributed \
            NEXTEST_PROFILE=ci COVERAGE_REPORT="--lcov --output-path lcov.info"
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  web:
    name: Web UI
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      # Chromium and its system libraries; `make web-e2e` installs only the
      # browser, which is enough where the libraries already exist.
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - run: make web-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            web/e2e/**/*-snapshots
      - run: make web-audit

  observability:
    name: Observability assets
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          # Keep in step with `nextest-version` in .config/nextest.toml.
          tool: cargo-nextest@0.9.146
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Install the locked web dependencies first, so the browser below is the
      # pinned Playwright's Chromium rather than the registry's latest.
      - run: make web-install
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      # Starts PostgreSQL for the exposition fixture, then the pinned
      # Prometheus/Grafana stack, executes every panel query, and renders both
      # dashboards in light and dark.
      - run: make observability
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: observability-screenshots
          path: target/observability

  dependencies:
    name: Dependency policy
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the registry and git checkouts are cached; nothing is compiled.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-targets: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - run: make deny
      - run: make machete

  ci:
    name: CI
    # The single required check. Skipped jobs count as success; a failure or
    # cancellation of the selector or any selected job fails this gate.
    if: always()
    needs: [changes, fmt, proto, lint, test, web, observability, dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a selected job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
