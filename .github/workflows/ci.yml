name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: make fmt-check

  proto:
    name: Protobuf lint and breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make proto-lint
      - run: make proto-breaking PROTO_BASE=origin/${{ github.base_ref || 'main' }}

  lint:
    name: Check, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: make check
      - run: make clippy
      - run: make doc

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://bergsmith:bergsmith@127.0.0.1:55432/bergsmith
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Start PostgreSQL
        run: make db-up
      - run: cargo nextest run --workspace --locked --profile ci
      - run: make coverage
      - run: >-
          cargo llvm-cov report --lcov --output-path lcov.info
          --ignore-filename-regex '(^|/)bin/'
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: make machete
