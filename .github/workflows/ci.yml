name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI: faster links and a smaller cache. Coverage uses
  # instrumentation, not debug info.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - run: make fmt-check

  proto:
    name: Protobuf lint and breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: make proto-lint
      - run: make proto-breaking PROTO_BASE=origin/${{ github.base_ref || 'main' }}

  lint:
    name: Check, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # clippy --all-targets type-checks everything `make check` would.
      - run: make clippy
      - run: make doc

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          # Keep in step with `nextest-version` in .config/nextest.toml.
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1
      # Build workspace tests and the real worker with one coverage environment.
      - name: Tests, coverage, and process recovery acceptance
        run: |
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit="bergsmith-acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=Delegate=yes --uid="$(id -u)" --gid="$(id -g)" \
            --working-directory="$PWD" --setenv="PATH=$PATH" --setenv="HOME=$HOME" \
            --setenv=CARGO_PROFILE_DEV_DEBUG=0 --setenv=CARGO_PROFILE_TEST_DEBUG=0 \
            --setenv="RUSTFLAGS=$RUSTFLAGS" --setenv="CARGO_INCREMENTAL=$CARGO_INCREMENTAL" \
            --setenv="RUST_BACKTRACE=$RUST_BACKTRACE" --setenv="CARGO_TERM_COLOR=$CARGO_TERM_COLOR" \
            /bin/bash deploy/docker/distributed-scope.sh coverage-distributed \
            NEXTEST_PROFILE=ci COVERAGE_REPORT="--lcov --output-path lcov.info"
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      # Chromium and its system libraries; `make web-e2e` installs only the
      # browser, which is enough where the libraries already exist.
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - run: make web-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
      - run: make web-audit

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only the registry and git checkouts are cached; nothing is compiled.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-targets: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - run: make deny
      - run: make machete
