name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI: faster links and a smaller cache. Coverage uses
  # instrumentation, not debug info.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - run: make fmt-check

  proto:
    name: Protobuf lint and breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make proto-lint
      - run: make proto-breaking PROTO_BASE=origin/${{ github.base_ref || 'main' }}

  lint:
    name: Check, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # clippy --all-targets type-checks everything `make check` would.
      - run: make clippy
      - run: make doc

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pull and boot the services while the toolchain and cache are
      # restored. Background processes live until the job ends.
      - name: Start test services in the background
        run: |
          nohup make services-up > services.log 2>&1 &
          echo $! > services.pid
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Wait for test services
        run: |
          pid=$(cat services.pid)
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          cat services.log
      # One instrumented run is both the test gate and the coverage gate.
      # `make coverage` re-runs `services-up`, which fails if they are not
      # healthy.
      - name: Tests and coverage
        run: make coverage NEXTEST_PROFILE=ci COVERAGE_REPORT="--lcov --output-path lcov.info"
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the registry and git checkouts are cached; nothing is compiled.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-targets: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - run: make deny
      - run: make machete
