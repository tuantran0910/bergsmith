# cargo-deny configuration. Run with `cargo deny check` or `make deny`.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # `paste` is archived (unmaintained, not a vulnerability). It is a
    # compile-time proc-macro used by `parquet` 58.4, and no maintained release
    # exists. Remove when Arrow/Parquet drop it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro via parquet; no fix available" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Public-domain dedication; tiny-keccak via Arrow's ahash.
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Workers never touch the Bergsmith database (AGENTS.md, architecture invariants).
    { crate = "bergsmith-persistence", wrappers = ["bergsmith-coordinator"], reason = "only the coordinator accesses PostgreSQL" },
    # Workers have no catalog client and no publication authority.
    { crate = "bergsmith-catalog", wrappers = ["bergsmith-coordinator"], reason = "only the coordinator talks to the catalog" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The pinned iceberg-rust fork (ADR 0003). Every crate uses one `rev`.
allow-git = ["https://github.com/risingwavelabs/iceberg-rust.git"]
