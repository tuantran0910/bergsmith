# cargo-deny configuration. Run with `cargo deny check` or `make deny`.

[graph]
all-features = true

[advisories]
yanked = "deny"
# The `paste` advisory that used to need an ignore is gone: nothing in the
# graph matches RUSTSEC-2024-0436, and cargo-deny fails an ignore that matches
# no crate. Add an entry here only for an advisory that is still reported.
# RUSTSEC-2026-0391, -0398, -0403, and -0410 were issued 2026-10-26 against
# zstd 0.13.3, zstd-safe 7.3.0, and zstd-sys 2.1.1, which arrive through
# apache-avro 0.21 under the pinned iceberg-rust revision. The patched releases
# are zstd >= 0.14.3 and zstd-safe >= 8.2.0, but apache-avro 0.21 and 0.22 both
# require zstd ^0.13.3, so no in-tree upgrade resolves them. -0410 affects
# wasm32 only, and -0398 needs the `seekable` feature, which the graph does not
# enable; -0391 and -0403 stay accepted risk until the upstream pin moves.
# TODO(BS-020.T5): remove these ignores when apache-avro allows zstd >= 0.14.3.
ignore = [
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0410",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Public-domain dedication; tiny-keccak via Arrow's ahash.
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Workers never touch the Bergsmith database (AGENTS.md, architecture invariants).
    { crate = "bergsmith-persistence", wrappers = ["bergsmith-coordinator"], reason = "only the coordinator accesses PostgreSQL" },
    # Workers have no catalog client and no publication authority.
    { crate = "bergsmith-catalog", wrappers = ["bergsmith-coordinator"], reason = "only the coordinator talks to the catalog" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The pinned iceberg-rust fork (ADR 0003). Every crate uses one `rev`.
allow-git = [
    "https://github.com/risingwavelabs/iceberg-rust.git",
    # BS-011 per-spec additions; immutable patch pin documented in ADR 0021.
    "https://github.com/thealtoclef/rw-iceberg-rust.git",
]
