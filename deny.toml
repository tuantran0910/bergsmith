# cargo-deny configuration. Run with `cargo deny check` or `make deny`.

[graph]
all-features = true

[advisories]
yanked = "deny"
# The `paste` advisory that used to need an ignore is gone: nothing in the
# graph matches RUSTSEC-2024-0436, and cargo-deny fails an ignore that matches
# no crate. Add an entry here only for an advisory that is still reported.
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Public-domain dedication; tiny-keccak via Arrow's ahash.
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Workers never touch the Bergsmith database (AGENTS.md, architecture invariants).
    { crate = "bergsmith-persistence", wrappers = ["bergsmith-coordinator"], reason = "only the coordinator accesses PostgreSQL" },
    # Workers have no catalog client and no publication authority.
    { crate = "bergsmith-catalog", wrappers = ["bergsmith-coordinator"], reason = "only the coordinator talks to the catalog" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The pinned iceberg-rust fork (ADR 0003). Every crate uses one `rev`.
allow-git = [
    "https://github.com/risingwavelabs/iceberg-rust.git",
    # BS-011 per-spec additions; immutable patch pin documented in ADR 0021.
    "https://github.com/thealtoclef/rw-iceberg-rust.git",
]
