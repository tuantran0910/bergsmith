[package]
name = "bergsmith-coordinator-bin"
description = "Bergsmith coordinator binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "bergsmith-coordinator"
path = "src/main.rs"
# Shares its name with the library crate; documenting both writes to the
# same `target/doc/<name>` directory and fails nondeterministically.
doc = false

[dependencies]
bergsmith-coordinator.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
