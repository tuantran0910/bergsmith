[package]
name = "bergsmith-worker-bin"
description = "Bergsmith worker binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "bergsmith-worker"
path = "src/main.rs"
# Shares its name with the library crate; documenting both writes to the
# same `target/doc/<name>` directory and fails nondeterministically.
doc = false

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
