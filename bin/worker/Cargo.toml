[package]
name = "bergsmith-worker-bin"
description = "Bergsmith worker binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "bergsmith-worker"
path = "src/main.rs"
# Shares its name with the library crate; documenting both writes to the
# same `target/doc/<name>` directory and fails nondeterministically.
doc = false

[dependencies]
bergsmith-worker.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
bergsmith-common.workspace = true
bergsmith-fixtures.workspace = true
bergsmith-maintenance.workspace = true
bergsmith-protocol.workspace = true
bergsmith-storage.workspace = true
futures.workspace = true
prost-types.workspace = true
tempfile.workspace = true
tokio-stream.workspace = true
tonic = { workspace = true, features = ["transport", "router"] }
uuid.workspace = true

[lints]
workspace = true
