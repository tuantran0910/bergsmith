# Older nextest silently ignores configuration it does not know. CI installs
# exactly this version (.github/workflows/ci.yml); install the same locally.
nextest-version = { required = "0.9.146" }

[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
# Report every failure in one run instead of stopping at the first.
fail-fast = false

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
