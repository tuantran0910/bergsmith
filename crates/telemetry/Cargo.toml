[package]
name = "bergsmith-telemetry"
description = "Log and trace installation for Bergsmith binaries, with optional OTLP export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Span capture for other crates' tests; never enabled in a binary.
testing = []

[dependencies]
http.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
opentelemetry-proto.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["transport", "router"] }

[lints]
workspace = true
