[package]
name = "bergsmith-protocol"
description = "Protobuf messages and generated tonic interfaces for Bergsmith services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bergsmith-common.workspace = true
prost.workspace = true
prost-types.workspace = true
thiserror.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
prost.workspace = true
prost-types.workspace = true
protox.workspace = true
tonic-prost-build.workspace = true

# The generated services in OUT_DIR use `tonic_prost::ProstCodec`, which
# cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["tonic-prost"]

[lints]
workspace = true
