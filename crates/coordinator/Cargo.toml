[package]
name = "bergsmith-coordinator"
description = "Bergsmith coordinator: APIs, scheduling, leases, reconciliation, and commits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Process acceptance requires a built worker and, on Linux, delegated cgroup v2.
distributed-tests = []

[[test]]
name = "distributed"
required-features = ["distributed-tests"]

[dependencies]
async-trait.workspace = true
futures.workspace = true
bergsmith-catalog.workspace = true
bergsmith-common.workspace = true
bergsmith-maintenance.workspace = true
bergsmith-persistence.workspace = true
bergsmith-protocol.workspace = true
bergsmith-storage.workspace = true
iceberg.workspace = true
parquet.workspace = true
prost.workspace = true
prost-types.workspace = true
chrono.workspace = true
# Worker TLS uses the explicitly initialized provider in worker_tls_config.
tonic = { workspace = true, features = ["transport", "router", "tls-aws-lc"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
uuid.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Observe a real task process and gate its metadata read during crash acceptance.
rustix = { workspace = true, features = ["fs"] }
sysinfo.workspace = true
tempfile.workspace = true
bergsmith-fixtures.workspace = true
mockito.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "test-util"] }
url.workspace = true

[lints]
workspace = true
