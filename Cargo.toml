[workspace]
resolver = "3"
members = ["crates/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
# Internal crates
bergsmith-catalog = { path = "crates/catalog" }
bergsmith-common = { path = "crates/common" }
bergsmith-coordinator = { path = "crates/coordinator" }
bergsmith-maintenance = { path = "crates/maintenance" }
bergsmith-persistence = { path = "crates/persistence" }
bergsmith-protocol = { path = "crates/protocol" }
bergsmith-storage = { path = "crates/storage" }
bergsmith-worker = { path = "crates/worker" }

# External crates. Git dependencies must be pinned by `rev` (see AGENTS.md).
# Iceberg: one pinned risingwavelabs/iceberg-rust revision for every crate
# (ADR 0003). Arrow and Parquet follow the versions that revision uses.
iceberg = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "f501ff0c245b4b625fe52feaf6125c69f7132557" }
iceberg-catalog-rest = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "f501ff0c245b4b625fe52feaf6125c69f7132557" }
iceberg-storage-opendal = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "f501ff0c245b4b625fe52feaf6125c69f7132557", default-features = false, features = ["opendal-s3"] }
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
parquet = { version = "58.4.0", default-features = false, features = ["arrow", "async"] }

futures = "0.3.34"
tokio = { version = "1.53.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.28.0", features = ["serde", "v7"] }

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
debug = "line-tables-only"
lto = "thin"
