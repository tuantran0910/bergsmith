[workspace]
resolver = "3"
members = ["crates/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
# Internal crates
bergsmith-catalog = { path = "crates/catalog" }
bergsmith-common = { path = "crates/common" }
bergsmith-coordinator = { path = "crates/coordinator" }
bergsmith-fixtures = { path = "crates/fixtures" }
bergsmith-maintenance = { path = "crates/maintenance" }
bergsmith-persistence = { path = "crates/persistence" }
bergsmith-protocol = { path = "crates/protocol" }
bergsmith-storage = { path = "crates/storage" }
bergsmith-worker = { path = "crates/worker" }

# External crates. Git dependencies must be pinned by `rev` (see AGENTS.md).
# Iceberg: one pinned risingwavelabs/iceberg-rust revision for every crate
# (ADR 0003). Arrow and Parquet follow the versions that revision uses.
iceberg = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "f501ff0c245b4b625fe52feaf6125c69f7132557" }
iceberg-catalog-rest = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "f501ff0c245b4b625fe52feaf6125c69f7132557" }
iceberg-storage-opendal = { git = "https://github.com/risingwavelabs/iceberg-rust.git", rev = "f501ff0c245b4b625fe52feaf6125c69f7132557", default-features = false, features = ["opendal-s3"] }
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
parquet = { version = "58.4.0", default-features = false, features = ["arrow", "async"] }

async-trait = "0.1.92"
bytes = "1.12.1"
futures = "0.3.34"
mockito = "1.7.2"
prost = "0.14.4"
# Property tests only; no process forking. Failing cases are saved under
# `proptest-regressions/`.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
prost-types = "0.14.4"
protox = "0.10.0"
# TLS for catalog HTTPS. Feature unification also gives iceberg-rust's reqwest TLS.
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "json", "rustls-tls-native-roots"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"
tonic-prost-build = { version = "0.14.6", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1.53.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# Runtime-only FileIO guards use iceberg's serializable storage interface.
typetag = "0.2.23"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["serde", "v7", "v8"] }
zeroize = "1.9.1"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
debug = "line-tables-only"
lto = "thin"
