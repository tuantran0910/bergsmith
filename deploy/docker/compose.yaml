# Development and test services. `make db-up` starts PostgreSQL for the test
# suite; the full development stack (Lakekeeper, RustFS, OIDC) arrives in BS-005
# and BS-020. Development only: never use these settings in production.
name: bergsmith

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: bergsmith
      POSTGRES_PASSWORD: bergsmith
      POSTGRES_DB: bergsmith
    # `#[sqlx::test]` opens a database per test; leave headroom for parallel runs.
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off"]
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bergsmith -d bergsmith"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
