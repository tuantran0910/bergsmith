# Development and test services, started by `make services-up`:
#
#   postgres     Bergsmith's execution ledger           127.0.0.1:55432
#   rustfs       S3-compatible object store with STS    127.0.0.1:59000
#   lakekeeper   Iceberg REST catalog that vends        127.0.0.1:58181
#                RustFS credentials through STS
#   keycloak     OIDC development provider              127.0.0.1:58080
#
# Tests bootstrap Lakekeeper and create their own warehouses.
#
# The OIDC development provider arrives with BS-017. Every credential here is
# a fake development value. Development only: never use these settings in
# production.
name: bergsmith

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: bergsmith
      POSTGRES_PASSWORD: bergsmith
      POSTGRES_DB: bergsmith
    # `#[sqlx::test]` opens a database per test; leave headroom for parallel
    # runs. fsync=off is for tests only. TLS uses the development certificate
    # from scripts/dev-pki.sh (`make services-up`); plaintext stays allowed.
    # PostgreSQL refuses a key it does not own, so the entrypoint copies it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        install -o postgres -g postgres -m 600 /pki/server.key /var/run/postgresql/server.key
        install -o postgres -g postgres -m 644 /pki/server.crt /var/run/postgresql/server.crt
        exec docker-entrypoint.sh postgres -c max_connections=300 -c fsync=off \
          -c ssl=on -c ssl_cert_file=/var/run/postgresql/server.crt \
          -c ssl_key_file=/var/run/postgresql/server.key
    volumes:
      - ./.pki/postgres:/pki:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bergsmith -d bergsmith"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    ports:
      - "127.0.0.1:59000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 60
    # RustFS runs as a non-root user.
    tmpfs:
      - /data:mode=1777

  # Creates the buckets the tests use, with the lifecycle rule Bergsmith
  # requires for incomplete multipart uploads.
  rustfs-init:
    image: amazon/aws-cli:2.38.1
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for bucket in warehouse storage-contract; do
          aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$bucket" 2>/dev/null \
            || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$bucket"
          aws --endpoint-url http://rustfs:9000 s3api put-bucket-lifecycle-configuration \
            --bucket "$$bucket" --lifecycle-configuration \
            '{"Rules":[{"ID":"abort-incomplete-uploads","Status":"Enabled","Filter":{"Prefix":""},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":1}}]}'
        done
    depends_on:
      rustfs:
        condition: service_healthy

  catalog-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    command: ["postgres", "-c", "fsync=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.14.1
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://lakekeeper:lakekeeper@catalog-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://lakekeeper:lakekeeper@catalog-db:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: development-only-not-a-real-key
      LAKEKEEPER__BASE_URI: http://127.0.0.1:58181
      # Parallel tests create warehouses concurrently; the default pools are
      # too small for that.
      LAKEKEEPER__PG_READ_POOL_CONNECTIONS: "40"
      LAKEKEEPER__PG_WRITE_POOL_CONNECTIONS: "40"
    depends_on:
      catalog-db:
        condition: service_healthy

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.14.1
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "127.0.0.1:58181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 1s
      timeout: 3s
      retries: 60
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  # OIDC development provider (BS-017). `start-dev` uses an in-memory database,
  # so the realm is re-imported on every start. The BS-017 test suites use a
  # mock provider instead; this service is for local sign-in journeys.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: development-only-not-a-real-password
      KC_HEALTH_ENABLED: "true"
      # Development only: the issuer is a plain-HTTP loopback URL.
      KC_HOSTNAME: "http://127.0.0.1:58080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:58080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000; \
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; \
          grep -q '"status": "UP"' <&3
      interval: 2s
      timeout: 5s
      retries: 60
