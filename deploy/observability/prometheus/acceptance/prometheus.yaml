# Acceptance configuration: scrape the exposition fixture written by the
# coordinator integration test and evaluate the shipped rules. The operator
# example lives in ../prometheus.example.yaml.
global:
  scrape_interval: 1s
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/rules/bergsmith.yaml

scrape_configs:
  - job_name: bergsmith
    metrics_path: /metrics
    # The static fixture server labels every path application/octet-stream;
    # the coordinator itself answers text/plain, so this is acceptance-only.
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["fixture:8000"]
